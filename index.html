<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="score-container">
            <div class="scoreboard">
                <p class="current-score" id="human-score"></p>
                <p class="current-score" id="round-result"></p>
                <p class="current-score" id="computer-score"></p>
            </div>
        </div>
        <div class="button-container">
            <button id ="rock" class="choice-button" value="Rock">Rock</button>
            <button id ="paper" class="choice-button" value="Paper">Paper</button>
            <button id ="scissors" class="choice-button" value="Scissors">Scissors</button>
        </div>
    </div>
</body>
</html>
